apiVersion: apps/v1
kind: Deployment

metadata:
  name: load-generator

spec:
  replicas: 4

  selector:
    matchLabels:
      app: load-generator

  template:
    metadata:
      labels:
        app: load-generator

    spec:
      containers:
        - name: load-generator
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                for i in $(seq 1 100); do
                  wget -q -O- http://api > /dev/null &
                done
                sleep 5
              done