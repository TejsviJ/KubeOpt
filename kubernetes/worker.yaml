apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker
          image: nginx:alpine

          resources:
            requests:
              cpu: "2"
              memory: "2Gi"

            limits:
              cpu: "4"
              memory: "4Gi"
              