apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: k8s-lab
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: agent
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          while true; do
            echo "Running on $(hostname)"
            sleep 10
          done
